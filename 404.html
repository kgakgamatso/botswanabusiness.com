<style>body{font:17px/1.5 system-ui,sans-serif;background:#f4efe6;color:#171411;margin:0;padding:48px 20px;text-align:center}a{color:#2f6c9f}</style>

<body>
<p>Finding that page… If nothing happens, <a href="/botswanabusiness.com/">go to the BotswanaBusiness.com home page</a>.</p>
<script>
(function () {
  // Pretty links such as /business/acme-ltd are rewritten to the app route /?/business/acme-ltd
  var base = '/botswanabusiness.com/';
  var p = location.pathname;
  if (p.indexOf(base) === 0) p = p.slice(base.length);
  p = p.replace(/^\/+|\/+$/g, '');
  if (!/^[A-Za-z0-9\-_/.]{0,200}$/.test(p)) p = '';
  if (/maintenance\.html$/.test(p)) { location.replace(base + 'maintenance.html'); return; }
  location.replace(base + (p ? '?/' + p : '') + (p && location.search ? '&' + location.search.slice(1).replace(/[^A-Za-z0-9\-_=&%.+]/g, '') : ''));
})();
</script>
</body>
